name: Synthetic Monitoring

on:
  schedule:
    - cron: "*/10 * * * *" # US
#    - cron: "1-59/30 * * * *" # JP
    - cron: "2-59/30 * * * *" # CA
    - cron: "4-59/30 * * * *" # EU
    - cron: "6-59/30 * * * *" # UK
    - cron: "8-59/30 * * * *" # AU
  workflow_dispatch:

concurrency:
  group: synthetic-monitor-${{ github.workflow }}-${{ github.event.schedule || github.ref }}
  cancel-in-progress: true

jobs:
  monitor:
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, mobile-iphone, mobile-android]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PLAYWRIGHT_WORKERS: "3"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # 根据 cron 判断国家
      - name: Set TARGET by cron
        run: |
          echo "CRON=${{ github.event.schedule }}" >> $GITHUB_ENV

          if [[ "${{ github.event.schedule }}" == "*/10 * * * *" ]]; then
            echo "TARGET=US" >> $GITHUB_ENV
          elif [[ "${{ github.event.schedule }}" == "1-59/30 * * * *" ]]; then
            echo "TARGET=JP" >> $GITHUB_ENV
          elif [[ "${{ github.event.schedule }}" == "2-59/30 * * * *" ]]; then
            echo "TARGET=CA" >> $GITHUB_ENV
          elif [[ "${{ github.event.schedule }}" == "4-59/30 * * * *" ]]; then
            echo "TARGET=EU" >> $GITHUB_ENV
          elif [[ "${{ github.event.schedule }}" == "6-59/30 * * * *" ]]; then
            echo "TARGET=UK" >> $GITHUB_ENV
          elif [[ "${{ github.event.schedule }}" == "8-59/30 * * * *" ]]; then
            echo "TARGET=AU" >> $GITHUB_ENV
          fi

      - name: Run Playwright tests
        run: npx playwright test --project="${{ matrix.project }}"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 30
